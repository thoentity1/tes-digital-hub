<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TES Earthworks Pro | Project Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bg: #07111f;
    --panel: #101f32;
    --panel2: #162940;
    --cyan: #00d6c9;
    --text: #e8f0f8;
    --muted: #91a6bc;
    --border: #263b52;
    --danger: #ff647c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 22px 30px;
    background: #0b192a;
    border-bottom: 1px solid var(--border);

    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.brand {
    color: var(--cyan);
    font-size: 23px;
    font-weight: bold;
}

.brand span {
    color: white;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    margin-top: 0;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 30px;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card,
.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
}

.stat-card small {
    color: var(--muted);
}

.stat-card h2 {
    color: var(--cyan);
    margin-bottom: 0;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
}

label {
    display: block;
    margin: 17px 0 8px;
    color: var(--muted);
    font-size: 14px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #091728;
    color: white;
    font-size: 14px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: var(--cyan);
}

button {
    border: none;
    border-radius: 7px;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.primary {
    background: var(--cyan);
    color: #04151c;
}

.secondary {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
}

.danger {
    background: var(--danger);
    color: white;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
}

.project {
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 14px;
}

.project h3 {
    color: var(--cyan);
    margin-top: 0;
}

.project p {
    color: var(--muted);
    font-size: 14px;
    overflow-wrap: anywhere;
}

.project-code {
    color: var(--cyan);
    font-size: 12px;
}

.toolbar {
    margin-bottom: 18px;
}

.message {
    margin-top: 18px;
    padding: 13px;
    border-radius: 7px;
    display: none;
    overflow-wrap: anywhere;
}

.success {
    background: #123b32;
    color: #75f0c1;
}

.error {
    background: #451e2a;
    color: #ff9bab;
}

#loading {
    color: var(--muted);
    padding: 15px 0;
}

.empty {
    color: var(--muted);
    padding: 20px 0;
}

.section-title {
    margin-top: 0;
    margin-bottom: 20px;
}

footer {
    text-align: center;
    padding: 25px;
    color: var(--muted);
    font-size: 12px;
}

@media(max-width:600px) {

    header {
        padding: 18px;
    }

    .container {
        padding: 20px 14px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

    <div class="brand">
        TES <span>EARTHWORKS PRO</span>
    </div>

    <button class="secondary" onclick="goDashboard()">
        ← Dashboard
    </button>

</header>


<div class="container">

    <h1>Project Management</h1>

    <p class="subtitle">
        Register and manage earthworks projects
        within TES Earthworks Pro.
    </p>


    <!-- PROJECT STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <small>Total Registered Projects</small>

            <h2 id="totalProjects">0</h2>

        </div>

        <div class="stat-card">

            <small>My Projects</small>

            <h2 id="myProjects">0</h2>

        </div>

    </div>


    <div class="grid">


        <!-- PROJECT REGISTRATION -->

        <div class="card">

            <h2 class="section-title">
                Register New Project
            </h2>


            <form id="projectForm">


                <label>Project Name *</label>

                <input
                    type="text"
                    id="projectName"
                    required
                    placeholder="Enter project name">


                <label>Project Code *</label>

                <input
                    type="text"
                    id="projectCode"
                    required
                    placeholder="Example: PVR-2026-001">


                <label>Client / Organisation *</label>

                <input
                    type="text"
                    id="clientName"
                    required
                    placeholder="Enter client name">


                <label>Project Description</label>

                <textarea
                    id="description"
                    placeholder="Describe the earthworks project...">
                </textarea>


                <label>Source Workbook</label>

                <input
                    type="text"
                    id="sourceWorkbook"
                    placeholder="MASTER EARTHWORKS PROGRESS TRACKER.xlsx">


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary"
                        id="saveButton">

                        Register Project

                    </button>


                    <button
                        type="button"
                        class="secondary"
                        onclick="resetForm()">

                        Clear

                    </button>

                </div>

            </form>


            <div id="message" class="message"></div>

        </div>



        <!-- PROJECT LIST -->

        <div class="card">

            <h2 class="section-title">
                Registered Projects
            </h2>


            <div class="toolbar">

                <input
                    type="search"
                    id="searchProjects"
                    placeholder="Search projects...">

            </div>


            <div id="loading">
                Loading projects...
            </div>


            <div id="projectList"></div>

        </div>


    </div>

</div>


<footer>

    THE ENTITY SOLUTIONS (PTY) LTD

    <br><br>

    TES Digital Hub | TES Earthworks Pro

</footer>



<script>

// =====================================================
// 1. SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
    "https://jgzvycawkkfdvdimdjat.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnenZ5Y2F3a2tmZHZkaW1kamF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzA0NjQsImV4cCI6MjEwODg0NjQ2NH0.M4Se5ri9hpHnYaMx8d6pbeZwIFCCvWMBOjS5Bx8c0kw";


const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// 2. GLOBAL VARIABLES
// =====================================================

let currentUser = null;

let projects = [];


// =====================================================
// 3. AUTHENTICATION
// =====================================================

async function initialise() {

    try {

        const {
            data,
            error
        } = await db.auth.getSession();


        if (error) {
            throw error;
        }


        if (!data.session) {

            window.location.href = "login.html";

            return;

        }


        currentUser = data.session.user;


        await loadProjects();

    }

    catch(error) {

        console.error(error);

        showMessage(
            "Authentication error: " + error.message,
            "error"
        );

    }

}


db.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_OUT" ||
            !session
        ) {

            window.location.href = "login.html";

        }

    }
);


// =====================================================
// 4. LOAD PROJECTS
// =====================================================

async function loadProjects() {

    const loading =
        document.getElementById("loading");


    loading.style.display = "block";


    const {
        data,
        error
    } = await db

        .from("ep_projects")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    loading.style.display = "none";


    if (error) {

        console.error(error);

        showMessage(
            "Could not load projects: " + error.message,
            "error"
        );

        return;

    }


    projects = data || [];


    renderProjects();

}


// =====================================================
// 5. REGISTER PROJECT
// =====================================================

document
    .getElementById("projectForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!currentUser) {

                showMessage(
                    "Please sign in first.",
                    "error"
                );

                return;

            }


            const saveButton =
                document.getElementById("saveButton");


            saveButton.disabled = true;

            saveButton.textContent = "Saving...";


            const payload = {

                id: crypto.randomUUID(),

                project_code:
                    document
                    .getElementById("projectCode")
                    .value.trim(),

                project_name:
                    document
                    .getElementById("projectName")
                    .value.trim(),

                client_name:
                    document
                    .getElementById("clientName")
                    .value.trim(),

                description:
                    document
                    .getElementById("description")
                    .value.trim() || null,

                source_workbook:
                    document
                    .getElementById("sourceWorkbook")
                    .value.trim() || null

            };


            try {


                // INSERT PROJECT
                // Do not append .select().single()
                // Project-owner trigger handles membership.


                const {
                    error
                } = await db

                    .from("ep_projects")

                    .insert(payload);


                if (error) {

                    throw error;

                }


                showMessage(
                    "Project registered successfully!",
                    "success"
                );


                resetForm();


                // Refresh project list separately.

                await loadProjects();


            }

            catch(error) {

                console.error(
                    "Project registration error:",
                    error
                );


                showMessage(
                    "Registration failed: " +
                    error.message,
                    "error"
                );

            }

            finally {

                saveButton.disabled = false;

                saveButton.textContent =
                    "Register Project";

            }

        }
    );



// =====================================================
// 6. DISPLAY PROJECTS
// =====================================================

function renderProjects() {


    const list =
        document.getElementById("projectList");


    const search =
        document
        .getElementById("searchProjects")
        .value
        .toLowerCase();


    const filtered = projects.filter(project => {

        return (

            (project.project_name || "")
                .toLowerCase()
                .includes(search)

            ||

            (project.project_code || "")
                .toLowerCase()
                .includes(search)

            ||

            (project.client_name || "")
                .toLowerCase()
                .includes(search)

        );

    });


    document.getElementById(
        "totalProjects"
    ).textContent = projects.length;


    document.getElementById(
        "myProjects"
    ).textContent = projects.filter(
        project => project.owner_id === currentUser.id
    ).length;


    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                No projects found.

                <br><br>

                Register your first earthworks project.

            </div>

        `;

        return;

    }


    list.innerHTML = filtered.map(project => `

        <div class="project">

            <h3>
                ${escapeHTML(project.project_name || "")}
            </h3>

            <div class="project-code">

                PROJECT CODE:
                ${escapeHTML(project.project_code || "")}

            </div>

            <p>

                <strong>Client:</strong>

                ${escapeHTML(project.client_name || "")}

            </p>

            <p>

                <strong>Description:</strong>

                ${escapeHTML(project.description || "Not provided")}

            </p>

            <p>

                <strong>Source Workbook:</strong>

                ${escapeHTML(project.source_workbook || "Not uploaded")}

            </p>

            <p>

                <strong>Created:</strong>

                ${project.created_at
                    ? new Date(project.created_at).toLocaleDateString()
                    : "Not available"}

            </p>

        </div>

    `).join("");

}



// =====================================================
// 7. RESET FORM
// =====================================================

function resetForm() {

    document
        .getElementById("projectForm")
        .reset();

}



// =====================================================
// 8. MESSAGE HANDLING
// =====================================================

function showMessage(message, type) {

    const box =
        document.getElementById("message");


    box.textContent = message;


    box.className =
        "message " + type;


    box.style.display = "block";

}



// =====================================================
// 9. HTML SECURITY
// =====================================================

function escapeHTML(value) {

    return String(value).replace(
        /[&<>"']/g,
        char => ({

            "&": "&amp;",

            "<": "&lt;",

            ">": "&gt;",

            '"': "&quot;",

            "'": "&#039;"

        })[char]
    );

}



// =====================================================
// 10. NAVIGATION
// =====================================================

function goDashboard() {

    window.location.href =
        "dashboard.html";

}



// =====================================================
// 11. PROJECT SEARCH
// =====================================================

document

    .getElementById("searchProjects")

    .addEventListener(
        "input",
        renderProjects
    );



// =====================================================
// 12. START APPLICATION
// =====================================================

initialise();


</script>

</body>

</html>
