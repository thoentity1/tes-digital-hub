<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TES Earthworks Pro | Projects</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #07111f;
    --panel: #101f32;
    --panel2: #162940;
    --cyan: #00d6c9;
    --text: #e8f0f8;
    --muted: #91a6bc;
    --border: #263b52;
    --danger: #ff647c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 22px 30px;
    background: #0b192a;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.brand {
    color: var(--cyan);
    font-size: 22px;
    font-weight: bold;
}

.brand span {
    color: white;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    margin-top: 0;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card, .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
}

.stat-card small {
    color: var(--muted);
}

.stat-card h2 {
    color: var(--cyan);
    margin-bottom: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: var(--muted);
    font-size: 14px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #091728;
    color: white;
    font-size: 14px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 17px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: var(--cyan);
    color: #04151c;
}

.secondary {
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
}

.danger {
    background: var(--danger);
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.project {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 14px;
}

.project h3 {
    color: var(--cyan);
    margin-top: 0;
}

.project p {
    color: var(--muted);
    font-size: 14px;
}

.project-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #173e43;
    color: var(--cyan);
    font-size: 12px;
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    display: none;
}

.success {
    background: #123b32;
    color: #75f0c1;
}

.error {
    background: #451e2a;
    color: #ff9bab;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toolbar input {
    flex: 1;
}

#loading {
    color: var(--muted);
    padding: 15px 0;
}

@media(max-width:600px) {
    header {
        padding: 18px;
    }

    .container {
        padding: 20px 14px;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        TES <span>EARTHWORKS PRO</span>
    </div>

    <button class="secondary" onclick="goDashboard()">
        ← Dashboard
    </button>
</header>

<div class="container">

    <h1>Project Management</h1>
    <p class="subtitle">
        Register, manage and monitor your earthworks projects.
    </p>

    <div class="stats">

        <div class="stat-card">
            <small>Total Projects</small>
            <h2 id="totalProjects">0</h2>
        </div>

        <div class="stat-card">
            <small>Active Projects</small>
            <h2 id="activeProjects">0</h2>
        </div>

        <div class="stat-card">
            <small>Completed Projects</small>
            <h2 id="completedProjects">0</h2>
        </div>

    </div>

    <div class="grid">

        <div class="card">

            <h2 id="formTitle">Register New Project</h2>

            <form id="projectForm">

                <input type="hidden" id="projectId">

                <label>Project Name *</label>
                <input
                    type="text"
                    id="projectName"
                    required
                    placeholder="Enter project name">

                <label>Project Code</label>
                <input
                    type="text"
                    id="projectCode"
                    placeholder="e.g. PVR-2026-001">

                <label>Client / Organisation *</label>
                <input
                    type="text"
                    id="clientName"
                    required
                    placeholder="PVR Surveyors">

                <label>Project Location</label>
                <input
                    type="text"
                    id="location"
                    placeholder="Project location">

                <label>Project Manager</label>
                <input
                    type="text"
                    id="manager"
                    placeholder="Project manager">

                <label>Start Date</label>
                <input type="date" id="startDate">

                <label>Expected Completion</label>
                <input type="date" id="endDate">

                <label>Project Status</label>
                <select id="projectStatus">
                    <option value="Active">Active</option>
                    <option value="Planning">Planning</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Completed">Completed</option>
                </select>

                <label>Project Description</label>
                <textarea
                    id="description"
                    placeholder="Describe the earthworks project..."></textarea>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary"
                        id="saveButton">
                        Register Project
                    </button>

                    <button
                        type="button"
                        class="secondary"
                        onclick="resetForm()">
                        Clear
                    </button>

                </div>

            </form>

            <div id="message" class="message"></div>

        </div>

        <div class="card">

            <h2>Registered Projects</h2>

            <div class="toolbar">
                <input
                    type="search"
                    id="searchProjects"
                    placeholder="Search projects...">
            </div>

            <div id="loading">Loading projects...</div>

            <div id="projectList"></div>

        </div>

    </div>

</div>

<script>

// ==================================================
// SUPABASE CONFIGURATION
// ==================================================

const SUPABASE_URL = "YOUR_EXISTING_SUPABASE_PROJECT_URL";

const SUPABASE_KEY = "YOUR_EXISTING_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ==================================================
// AUTHENTICATION
// ==================================================

let currentUser = null;
let projects = [];

async function initialise() {

    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
        window.location.href = "login.html";
        return;
    }

    currentUser = data.session.user;

    await loadProjects();

}

db.auth.onAuthStateChange((event, session) => {

    if (event === "SIGNED_OUT" || !session) {
        window.location.href = "login.html";
    }

});

// ==================================================
// LOAD PROJECTS
// ==================================================

async function loadProjects() {

    document.getElementById("loading").style.display = "block";

    const { data, error } = await db
        .from("ep_projects")
        .select("*")
        .order("created_at", { ascending: false });

    document.getElementById("loading").style.display = "none";

    if (error) {
        showMessage(error.message, "error");
        return;
    }

    projects = data || [];

    renderProjects();

}

// ==================================================
// REGISTER PROJECT
// ==================================================

document.getElementById("projectForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!currentUser) {
        showMessage("Please sign in first.", "error");
        return;
    }

    const saveButton = document.getElementById("saveButton");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    const projectId = document.getElementById("projectId").value;

    const payload = {

        project_name: document.getElementById("projectName").value.trim(),

        project_code: document.getElementById("projectCode").value.trim() || null,

        client_name: document.getElementById("clientName").value.trim(),

        location: document.getElementById("location").value.trim() || null,

        project_manager: document.getElementById("manager").value.trim() || null,

        start_date: document.getElementById("startDate").value || null,

        end_date: document.getElementById("endDate").value || null,

        status: document.getElementById("projectStatus").value,

        description: document.getElementById("description").value.trim() || null

    };

    try {

        let result;

        if (projectId) {

            result = await db
                .from("ep_projects")
                .update(payload)
                .eq("id", projectId);

        } else {

            result = await db
                .from("ep_projects")
                .insert({
                    id: crypto.randomUUID(),
                    ...payload
                });

        }

        if (result.error) {
            throw result.error;
        }

        showMessage(
            projectId
                ? "Project updated successfully."
                : "Project registered successfully.",
            "success"
        );

        resetForm();

        await loadProjects();

    } catch (error) {

        console.error("Project registration error:", error);

        showMessage(error.message, "error");

    } finally {

        saveButton.disabled = false;
        saveButton.textContent = "Register Project";

    }

});

// ==================================================
// DISPLAY PROJECTS
// ==================================================

function renderProjects() {

    const list = document.getElementById("projectList");

    const search = document
        .getElementById("searchProjects")
        .value.toLowerCase();

    const filtered = projects.filter(project => {

        return (

            (project.project_name || "").toLowerCase().includes(search) ||

            (project.project_code || "").toLowerCase().includes(search) ||

            (project.client_name || "").toLowerCase().includes(search)

        );

    });

    document.getElementById("totalProjects").textContent =
        projects.length;

    document.getElementById("activeProjects").textContent =
        projects.filter(p => p.status === "Active").length;

    document.getElementById("completedProjects").textContent =
        projects.filter(p => p.status === "Completed").length;

    if (!filtered.length) {

        list.innerHTML = `
            <p style="color:#91a6bc">
                No projects found.
            </p>
        `;

        return;

    }

    list.innerHTML = filtered.map(project => `

        <div class="project">

            <h3>${escapeHTML(project.project_name || "")}</h3>

            <span class="status">
                ${escapeHTML(project.status || "Active")}
            </span>

            <p>
                <strong>Code:</strong>
                ${escapeHTML(project.project_code || "Not assigned")}
            </p>

            <p>
                <strong>Client:</strong>
                ${escapeHTML(project.client_name || "")}
            </p>

            <p>
                <strong>Location:</strong>
                ${escapeHTML(project.location || "Not specified")}
            </p>

            <p>
                <strong>Manager:</strong>
                ${escapeHTML(project.project_manager || "Not assigned")}
            </p>

            <div class="project-actions">

                <button
                    class="secondary"
                    onclick="editProject('${project.id}')">
                    Edit
                </button>

                <button
                    class="danger"
                    onclick="deleteProject('${project.id}')">
                    Delete
                </button>

            </div>

        </div>

    `).join("");

}

// ==================================================
// EDIT PROJECT
// ==================================================

function editProject(id) {

    const project = projects.find(p => p.id === id);

    if (!project) return;

    document.getElementById("projectId").value = project.id;

    document.getElementById("projectName").value =
        project.project_name || "";

    document.getElementById("projectCode").value =
        project.project_code || "";

    document.getElementById("clientName").value =
        project.client_name || "";

    document.getElementById("location").value =
        project.location || "";

    document.getElementById("manager").value =
        project.project_manager || "";

    document.getElementById("startDate").value =
        project.start_date || "";

    document.getElementById("endDate").value =
        project.end_date || "";

    document.getElementById("projectStatus").value =
        project.status || "Active";

    document.getElementById("description").value =
        project.description || "";

    document.getElementById("formTitle").textContent =
        "Edit Project";

    document.getElementById("saveButton").textContent =
        "Update Project";

    document.getElementById("projectName").focus();

}

// ==================================================
// DELETE PROJECT
// ==================================================

async function deleteProject(id) {

    const confirmed = confirm(
        "Are you sure you want to delete this project?"
    );

    if (!confirmed) return;

    const { error } = await db
        .from("ep_projects")
        .delete()
        .eq("id", id);

    if (error) {

        showMessage(error.message, "error");

        return;

    }

    showMessage("Project deleted.", "success");

    await loadProjects();

}

// ==================================================
// RESET FORM
// ==================================================

function resetForm() {

    document.getElementById("projectForm").reset();

    document.getElementById("projectId").value = "";

    document.getElementById("formTitle").textContent =
        "Register New Project";

    document.getElementById("saveButton").textContent =
        "Register Project";

}

// ==================================================
// MESSAGE HANDLING
// ==================================================

function showMessage(message, type) {

    const box = document.getElementById("message");

    box.textContent = message;

    box.className = "message " + type;

    box.style.display = "block";

}

// ==================================================
// HTML ESCAPING
// ==================================================

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

    })[char]);

}

// ==================================================
// NAVIGATION
// ==================================================

function goDashboard() {

    window.location.href = "dashboard.html";

}

// ==================================================
// SEARCH
// ==================================================

document
.getElementById("searchProjects")
.addEventListener("input", renderProjects);

// ==================================================
// START APPLICATION
// ==================================================

initialise();

</script>

</body>
</html>
