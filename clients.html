<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TES Digital Hub | Client Management</title>

<style>
:root {
    --bg:#07111f;
    --panel:#0d1b2c;
    --panel2:#102338;
    --line:rgba(137,180,202,.18);
    --text:#eef7fb;
    --muted:#9bb0c1;
    --teal:#19d3d0;
    --danger:#ff8c8c;
}
*{box-sizing:border-box}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}
header{
    padding:20px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    background:#050d18;
}
.brand{font-size:19px;font-weight:bold;letter-spacing:2px}
.brand span{color:var(--teal)}
header a{color:var(--teal);text-decoration:none}
main{max-width:1250px;margin:auto;padding:35px 22px}
h1{font-size:32px;margin-bottom:8px}
.subtitle{color:var(--muted);margin-bottom:30px}
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}
.stat,.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:27px;margin-top:12px}
.toolbar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}
button{
    cursor:pointer;
    border:0;
    border-radius:7px;
    padding:11px 17px;
    font-weight:bold;
}
.primary{background:var(--teal);color:#06151b}
.secondary{background:var(--panel2);color:white;border:1px solid var(--line)}
.danger{background:#57252d;color:#ffdede}
input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #35495b;
    border-radius:7px;
    background:#081321;
    color:white;
    font:inherit;
}
input:focus,select:focus,textarea:focus{
    outline:1px solid var(--teal);
}
.search{max-width:380px}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{
    text-align:left;
    padding:15px 12px;
    border-bottom:1px solid var(--line);
    font-size:13px;
}
th{color:var(--teal)}
.table-wrap{overflow-x:auto}
.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    background:#183d3c;
    color:#7ff2dd;
}
.badge.inactive{background:#443b27;color:#f3d58c}
.badge.suspended{background:#50252c;color:#ffaaaa}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:7px 10px;font-size:11px}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:10;
}
.modal.show{display:flex}
.modal-content{
    width:100%;
    max-width:560px;
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:25px;
}
.modal-content h2{margin-top:0}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.form-group{margin-bottom:15px}
.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
    color:var(--muted);
}
.full{grid-column:1/-1}
.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}
#message{
    display:none;
    padding:13px;
    margin-bottom:15px;
    border-radius:7px;
    font-size:13px;
}
#message.show{display:block}
#message.error{background:#50252c;color:#ffaaaa}
#message.success{background:#183d3c;color:#7ff2dd}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:650px){
    .stats{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    header{padding:17px}
}
</style>
</head>

<body>

<header>
    <div class="brand"><span>TES</span> | CLIENT MANAGEMENT</div>
    <a href="admin.html">← Admin Centre</a>
</header>

<main>

    <h1>Client Management</h1>
    <p class="subtitle">
        Manage your TES business clients and company information.
    </p>

    <div id="message"></div>

    <section class="stats">
        <div class="stat">
            <small>Total Clients</small>
            <strong id="totalClients">0</strong>
        </div>
        <div class="stat">
            <small>Active Clients</small>
            <strong id="activeClients">0</strong>
        </div>
        <div class="stat">
            <small>Inactive / Suspended</small>
            <strong id="inactiveClients">0</strong>
        </div>
    </section>

    <div class="toolbar">
        <input
            class="search"
            id="search"
            type="search"
            placeholder="Search company, contact or email..."
        >

        <button class="primary" id="addClient">
            + Register New Client
        </button>
    </div>

    <section class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Contact Person</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientRows">
                    <tr><td colspan="6" class="empty">Loading clients...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<!-- CLIENT FORM -->

<div class="modal" id="clientModal">
    <div class="modal-content">

        <h2 id="modalTitle">Register Client</h2>

        <form id="clientForm">

            <input type="hidden" id="clientId">

            <div class="form-grid">

                <div class="form-group full">
                    <label>Company Name *</label>
                    <input id="companyName" required>
                </div>

                <div class="form-group">
                    <label>Contact Person *</label>
                    <input id="contactPerson" required>
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input id="email" type="email" required>
                </div>

                <div class="form-group">
                    <label>Telephone</label>
                    <input id="phone">
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input id="registrationNumber">
                </div>

                <div class="form-group">
                    <label>VAT Number</label>
                    <input id="vatNumber">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Business Address</label>
                    <textarea id="address" rows="2"></textarea>
                </div>

                <div class="form-group full">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="button" class="secondary" id="cancelForm">
                    Cancel
                </button>

                <button type="submit" class="primary" id="saveButton">
                    Save Client
                </button>
            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* SUPABASE CONFIGURATION */

const SUPABASE_URL =
"https://jgzvycawkkfdvdimdjat.supabase.co";

/*
 Paste the exact SUPABASE_PUBLISHABLE_KEY
 from your working admin.html configuration.
*/
const SUPABASE_PUBLISHABLE_KEY =
"PASTE_THE_EXISTING_ADMIN_KEY_HERE";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let clients = [];

/* ELEMENTS */

const rows = document.getElementById("clientRows");
const modal = document.getElementById("clientModal");
const form = document.getElementById("clientForm");
const message = document.getElementById("message");

/* MESSAGE */

function notify(text,type="success"){
    message.textContent = text;
    message.className = "show " + type;
    window.scrollTo({top:0,behavior:"smooth"});
}

/* SECURITY CHECK */

async function initialise(){

    try{

        const {data,error} = await db.auth.getSession();

        if(error) throw error;

        if(!data.session){
            window.location.href="login.html";
            return;
        }

        currentUser=data.session.user;

        const {data:profile,error:profileError} =
        await db.from("profiles")
        .select("role")
        .eq("id",currentUser.id)
        .single();

        if(profileError) throw profileError;

        if(profile.role!=="admin"){
            document.body.innerHTML =
            "<h2 style='color:white;text-align:center;margin-top:100px'>Access denied. Administrator access required.</h2>";
            return;
        }

        await loadClients();

    }catch(error){

        console.error(error);

        notify(
            "Unable to initialise Client Management: "+error.message,
            "error"
        );
    }
}

/* LOAD CLIENTS */

async function loadClients(){

    rows.innerHTML =
    '<tr><td colspan="6" class="empty">Loading...</td></tr>';

    const {data,error} = await db
        .from("clients")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){
        throw error;
    }

    clients=data || [];

    updateStats();
    renderClients();
}

/* STATISTICS */

function updateStats(){

    document.getElementById("totalClients").textContent =
    clients.length;

    document.getElementById("activeClients").textContent =
    clients.filter(c=>c.status==="active").length;

    document.getElementById("inactiveClients").textContent =
    clients.filter(c=>c.status!=="active").length;
}

/* DISPLAY DIRECTORY */

function renderClients(){

    const query =
    document.getElementById("search").value.toLowerCase();

    const filtered=clients.filter(c=>
        (c.company_name || "").toLowerCase().includes(query) ||
        (c.contact_person || "").toLowerCase().includes(query) ||
        (c.email || "").toLowerCase().includes(query)
    );

    if(!filtered.length){
        rows.innerHTML =
        '<tr><td colspan="6" class="empty">No clients found.</td></tr>';
        return;
    }

    rows.innerHTML=filtered.map(c=>`

        <tr>
            <td><strong>${escapeHTML(c.company_name)}</strong></td>
            <td>${escapeHTML(c.contact_person)}</td>
            <td>${escapeHTML(c.email)}</td>
            <td>${escapeHTML(c.phone || "-")}</td>
            <td>
                <span class="badge ${c.status}">
                    ${escapeHTML(c.status)}
                </span>
            </td>
            <td>
                <div class="actions">
                    <button class="secondary"
                        onclick="editClient('${c.id}')">
                        Edit
                    </button>

                    <button class="secondary"
                        onclick="changeStatus('${c.id}')">
                        Status
                    </button>

                    <button class="danger"
                        onclick="deleteClient('${c.id}')">
                        Delete
                    </button>
                </div>
            </td>
        </tr>

    `).join("");
}

/* SAFE HTML OUTPUT */

function escapeHTML(value){

    return String(value).replace(/[&<>"']/g,function(char){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[char];
    });
}

/* OPEN NEW CLIENT FORM */

document.getElementById("addClient")
.addEventListener("click",()=>{

    form.reset();

    document.getElementById("clientId").value="";
    document.getElementById("modalTitle").textContent="Register New Client";
    document.getElementById("saveButton").textContent="Save Client";

    modal.classList.add("show");
});

/* EDIT CLIENT */

window.editClient=function(id){

    const c=clients.find(x=>x.id===id);

    if(!c)return;

    document.getElementById("clientId").value=c.id;
    document.getElementById("companyName").value=c.company_name;
    document.getElementById("contactPerson").value=c.contact_person;
    document.getElementById("email").value=c.email;
    document.getElementById("phone").value=c.phone || "";
    document.getElementById("registrationNumber").value=c.registration_number || "";
    document.getElementById("vatNumber").value=c.vat_number || "";
    document.getElementById("address").value=c.address || "";
    document.getElementById("notes").value=c.notes || "";
    document.getElementById("status").value=c.status;

    document.getElementById("modalTitle").textContent="Edit Client";
    document.getElementById("saveButton").textContent="Update Client";

    modal.classList.add("show");
};

/* SAVE CLIENT */

form.addEventListener("submit",async function(event){

    event.preventDefault();

    const id=document.getElementById("clientId").value;

    const record={

        company_name:document.getElementById("companyName").value.trim(),
        contact_person:document.getElementById("contactPerson").value.trim(),
        email:document.getElementById("email").value.trim().toLowerCase(),
        phone:document.getElementById("phone").value.trim(),
        registration_number:document.getElementById("registrationNumber").value.trim(),
        vat_number:document.getElementById("vatNumber").value.trim(),
        address:document.getElementById("address").value.trim(),
        notes:document.getElementById("notes").value.trim(),
        status:document.getElementById("status").value,
        updated_at:new Date().toISOString()
    };

    const saveButton=document.getElementById("saveButton");

    saveButton.disabled=true;
    saveButton.textContent="Saving...";

    try{

        let result;

        if(id){

            result=await db
                .from("clients")
                .update(record)
                .eq("id",id);

        }else{

            record.created_by=currentUser.id;

            result=await db
                .from("clients")
                .insert(record);

        }

        if(result.error)throw result.error;

        modal.classList.remove("show");

        form.reset();

        await loadClients();

        notify(id?"Client updated successfully.":"Client registered successfully.");

    }catch(error){

        console.error(error);
        notify("Unable to save client: "+error.message,"error");

    }finally{

        saveButton.disabled=false;
        saveButton.textContent=id?"Update Client":"Save Client";

    }

});

/* CHANGE CLIENT STATUS */

window.changeStatus=async function(id){

    const c=clients.find(x=>x.id===id);

    if(!c)return;

    const options=["active","inactive","suspended"];

    const next=prompt(
        "Enter new status:\nactive\ninactive\nsuspended",
        c.status
    );

    if(next===null)return;

    if(!options.includes(next.trim().toLowerCase())){
        notify("Invalid status.","error");
        return;
    }

    const {error}=await db
        .from("clients")
        .update({
            status:next.trim().toLowerCase(),
            updated_at:new Date().toISOString()
        })
        .eq("id",id);

    if(error){
        notify(error.message,"error");
        return;
    }

    await loadClients();

    notify("Client status updated.");
};

/* DELETE CLIENT */

window.deleteClient=async function(id){

    const c=clients.find(x=>x.id===id);

    if(!c)return;

    if(!confirm(
        "Delete "+c.company_name+"?\n\nThis will permanently remove this client record."
    ))return;

    const {error}=await db
        .from("clients")
        .delete()
        .eq("id",id);

    if(error){
        notify(error.message,"error");
        return;
    }

    await loadClients();

    notify("Client record deleted.");
};

/* SEARCH */

document.getElementById("search")
.addEventListener("input",renderClients);

/* CLOSE FORM */

document.getElementById("cancelForm")
.addEventListener("click",()=>{
    modal.classList.remove("show");
});

modal.addEventListener("click",event=>{
    if(event.target===modal){
        modal.classList.remove("show");
    }
});

/* START */

initialise();

</script>

</body>
</html>
