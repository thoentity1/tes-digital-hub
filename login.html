<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Sign In | TES Digital Hub</title>

<style>
:root {
  --bg:#080b12;
  --panel:#101827;
  --teal:#27e6e6;
  --white:#f5f8ff;
  --muted:#a7b2c5;
  --border:rgba(39,230,230,.30);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);
  background:radial-gradient(circle at center,rgba(0,153,255,.22),transparent 55%),var(--bg);
}
header {
  padding:20px 6%;
  background:rgba(7,11,20,.96);
  border-bottom:1px solid var(--border);
}
.header-inner {
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
a { color:var(--teal); text-decoration:none; }
.logo { font-size:22px; font-weight:bold; color:var(--teal); }
.logo small {
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  font-weight:normal;
  margin-top:5px;
}
.home-link { color:var(--white); font-size:13px; }
main {
  flex:1;
  display:grid;
  place-items:center;
  padding:40px 16px;
}
.wrap { width:100%; max-width:430px; }
.brand { text-align:center; margin-bottom:26px; }
.brand-mark {
  font-size:40px;
  font-weight:bold;
  letter-spacing:8px;
  color:var(--teal);
}
.brand-name {
  font-size:10px;
  letter-spacing:3px;
  color:var(--muted);
  margin-top:7px;
}
h1 { font-size:27px; margin:25px 0 8px; }
.subtitle,.description { color:var(--muted); font-size:13px; }
.card {
  background:rgba(16,24,39,.96);
  border:1px solid var(--border);
  border-radius:15px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
h2 { font-size:20px; margin:0 0 8px; }
.description { margin:0 0 24px; }
.field { margin:0 0 18px; }
label { display:block; font-size:13px; margin-bottom:8px; }
input[type="text"],input[type="password"] {
  width:100%;
  height:46px;
  padding:0 13px;
  border:1px solid #354256;
  border-radius:8px;
  background:#080d16;
  color:var(--white);
  font-size:14px;
  outline:none;
}
input:focus {
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(39,230,230,.08);
}
.password-wrap { position:relative; }
.password-wrap input { padding-right:70px; }
.show {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--teal);
  cursor:pointer;
}
.options {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:4px 0 22px;
  font-size:12px;
}
.remember {
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
}
.remember input { accent-color:var(--teal); }
.forgot {
  color:var(--teal);
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
  font-size:12px;
}
.submit {
  width:100%;
  height:47px;
  border:0;
  border-radius:8px;
  background:var(--teal);
  color:#071018;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}
.submit:disabled { opacity:.65; cursor:wait; }
.message {
  display:none;
  margin-top:16px;
  padding:12px;
  border-radius:7px;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.message.show { display:block; }
.message.error {
  border:1px solid rgba(255,193,7,.3);
  background:rgba(255,193,7,.07);
  color:#ffda79;
}
.message.success {
  border:1px solid rgba(39,230,160,.3);
  background:rgba(39,230,160,.07);
  color:#70efb8;
}
.note {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  margin-top:20px;
}
footer {
  text-align:center;
  padding:22px 12px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
}
@media(max-width:480px) {
  .card { padding:23px 19px; }
  .header-inner { align-items:flex-start; }
  .logo { font-size:19px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      TES DIGITAL HUB
      <small>THE ENTITY SOLUTIONS</small>
    </a>
    <a class="home-link" href="index.html">← Back to Home</a>
  </div>
</header>

<main>
<div class="wrap">

<section class="brand">
  <div class="brand-mark">TES</div>
  <div class="brand-name">THE ENTITY SOLUTIONS</div>
  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to your digital workspace.</p>
</section>

<section class="card">
  <h2>Sign In</h2>
  <p class="description">Enter your account details to continue.</p>

  <form id="loginForm">

    <div class="field">
      <label for="username">Email address</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your email address"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>
        <button class="show" type="button" id="togglePassword">Show</button>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" id="remember" checked>
        Remember me
      </label>
