<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Password | TES Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    background:#071426;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box {
    background:#10243a;
    padding:35px;
    border-radius:15px;
    width:340px;
    border:1px solid #24c6b5;
}
h2 {color:#24c6b5;}
input,button {
    width:100%;
    padding:14px;
    margin:12px 0;
    box-sizing:border-box;
    border-radius:7px;
}
button {
    background:#24c6b5;
    border:0;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h2>Set Your Password</h2>
<p>Welcome to TES Digital Hub. Create your password to activate your account.</p>

<input type="password" id="password"
placeholder="New password">

<input type="password" id="confirm"
placeholder="Confirm password">

<button onclick="setPassword()">Activate Account</button>

<p id="message"></p>
</div>

<script>

const SUPABASE_URL = "https://jgzvycawkkfdvdimdjat.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_Qee9wbZ8erSC2dDDkSo9vg_3uh_gbgO";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
        }
    }
);

// VERIFY INVITATION
async function verifyInvitation() {

    const message = document.getElementById("message");

    try {

        const url = new URL(window.location.href);

        const code = url.searchParams.get("code");
        const tokenHash = url.searchParams.get("token_hash");
        const type = url.searchParams.get("type");

        const hash = new URLSearchParams(
            url.hash.substring(1)
        );

        let result = null;

        if (code) {

            result = await db.auth.exchangeCodeForSession(code);

        } else if (tokenHash && type) {

            result = await db.auth.verifyOtp({
                token_hash: tokenHash,
                type: type
            });

        } else if (
            hash.get("access_token") &&
            hash.get("refresh_token")
        ) {

            result = await db.auth.setSession({
                access_token: hash.get("access_token"),
                refresh_token: hash.get("refresh_token")
            });

        }

        if (result && result.error) {
            throw result.error;
        }

        if (code || tokenHash || hash.get("access_token")) {
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (!data.session) {
            message.innerText =
                "Invitation could not be verified. Please request a new invitation.";
            return;
        }

        message.innerText = "Invitation verified. Please set your password.";

    } catch (error) {

        message.innerText = error.message;

    }
}


// SET PASSWORD
async function setPassword() {

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    const message =
        document.getElementById("message");

    if (password.length < 8) {
        message.innerText =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirm) {
        message.innerText =
            "Passwords do not match.";
        return;
    }

    message.innerText = "Activating account...";

    try {

        const { data } = await db.auth.getSession();

        if (!data.session) {
            message.innerText =
                "Invitation session expired. Request a new invitation.";
            return;
        }

        const { error } = await db.auth.updateUser({
            password: password
        });

        if (error) throw error;

        message.innerText =
            "Account activated successfully! Redirecting to login...";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);

    } catch (error) {

        message.innerText = error.message;

    }

}


// RUN INVITATION VERIFICATION
verifyInvitation();

</script>
</body>
</html>
