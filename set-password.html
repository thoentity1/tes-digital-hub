<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Password | TES Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    background:#071426;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box {
    background:#10243a;
    padding:35px;
    border-radius:15px;
    width:340px;
    border:1px solid #24c6b5;
}
h2 {color:#24c6b5;}
input,button {
    width:100%;
    padding:14px;
    margin:12px 0;
    box-sizing:border-box;
    border-radius:7px;
}
button {
    background:#24c6b5;
    border:0;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h2>Set Your Password</h2>
<p>Welcome to TES Digital Hub. Create your password to activate your account.</p>

<input type="password" id="password"
placeholder="New password">

<input type="password" id="confirm"
placeholder="Confirm password">

<button onclick="setPassword()">Activate Account</button>

<p id="message"></p>
</div>

<script>

const SUPABASE_URL = "https://jgzvycawkkfdvdimdjat.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qee9wbZ8erSC2dDDkSo9vg_3uh_gbgO";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

async function setPassword() {

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const message = document.getElementById("message");

    if(password.length < 8) {
        message.innerText = "Password must be at least 8 characters.";
        return;
    }

    if(password !== confirm) {
        message.innerText = "Passwords do not match.";
        return;
    }

    const {data: {session}} = await db.auth.getSession();

    if(!session) {
        message.innerText =
        "Invitation session expired. Please request a new invitation.";
        return;
    }

    const {error} = await db.auth.updateUser({
        password: password
    });

    if(error) {
        message.innerText = error.message;
        return;
    }

    message.innerText = "Account activated successfully!";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 2000);
}

</script>
</body>
</html>
