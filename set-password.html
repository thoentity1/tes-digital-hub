<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TES Digital Hub | Set Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080d18;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 40px 30px;
    background: #111c2e;
    border: 1px solid #26384b;
    border-radius: 15px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 7px;
    color: #20c9b5;
}

.brand {
    font-size: 11px;
    letter-spacing: 3px;
    color: #aab6c5;
    margin-bottom: 35px;
}

h1 {
    font-size: 27px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aab6c5;
    margin-bottom: 30px;
    font-size: 14px;
}

label {
    display: block;
    text-align: left;
    margin: 18px 0 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px;
    background: #0b1422;
    border: 1px solid #34465b;
    border-radius: 8px;
    color: white;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #20c9b5;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    background: #20c9b5;
    color: #07131c;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#message {
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.success {
    color: #20c9b5;
}

.error {
    color: #ff7777;
}

.footer {
    margin-top: 30px;
    color: #78899c;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">TES</div>

    <div class="brand">THE ENTITY SOLUTIONS</div>

    <h1>Set Your Password</h1>

    <p class="subtitle">
        Create a secure password for your digital workspace.
    </p>

    <div id="loading">
        Verifying your invitation or recovery link...
    </div>

    <form id="passwordForm" style="display:none;">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            minlength="8"
            placeholder="Enter new password"
            required
        >

        <label for="confirm">Confirm Password</label>

        <input
            type="password"
            id="confirm"
            minlength="8"
            placeholder="Confirm new password"
            required
        >

        <button type="submit" id="saveButton">
            SAVE PASSWORD
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        TES Digital Hub | Secure Account Access
    </div>

</div>

<script>

// ========================================
// SUPABASE CONFIGURATION
// ========================================

// IMPORTANT:
// Copy the EXACT existing project URL and
// anon/public key from your previous HTML.

const SUPABASE_URL = "sb_publishable_Qee9wbZ8erSC2dDDkSo9vg_3uh_gbgO";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnenZ5Y2F3a2tmZHZkaW1kamF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzA0NjQsImV4cCI6MjEwODg0NjQ2NH0.M4Se5ri9hpHnYaMx8d6pbeZwIFCCvWMBOjS5Bx8c0kw";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
        }
    }
);

// ========================================
// PAGE ELEMENTS
// ========================================

const form = document.getElementById("passwordForm");
const loading = document.getElementById("loading");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

let verified = false;

// ========================================
// VERIFY INVITATION / RECOVERY
// ========================================

async function verifyInvitation() {

    try {

        const url = new URL(window.location.href);

        const params = url.searchParams;

        const hash = new URLSearchParams(
            url.hash.substring(1)
        );

        const code = params.get("code");

        const tokenHash = params.get("token_hash");

        const accessToken = hash.get("access_token");

        const refreshToken = hash.get("refresh_token");

        const authType =
            params.get("type") ||
            hash.get("type") ||
            "invite";

        let result = null;

        // METHOD 1: PKCE CODE

        if (code) {

            result = await db.auth.exchangeCodeForSession(code);

        }

        // METHOD 2: TOKEN HASH

        else if (tokenHash) {

            result = await db.auth.verifyOtp({

                token_hash: tokenHash,

                type: authType

            });

        }

        // METHOD 3: ACCESS AND REFRESH TOKENS

        else if (accessToken && refreshToken) {

            result = await db.auth.setSession({

                access_token: accessToken,

                refresh_token: refreshToken

            });

        }

        if (result && result.error) {

            throw result.error;

        }

        // CHECK AUTHENTICATED SESSION

        const { data, error } =
            await db.auth.getSession();

        if (error) throw error;

        if (!data.session) {

            throw new Error(
                "Your invitation or recovery link is invalid or expired. Please request a new link."
            );

        }

        // SESSION VERIFIED

        verified = true;

        // Remove authentication tokens from address bar
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        loading.style.display = "none";

        form.style.display = "block";

        message.className = "success";

        message.innerText =
            "Account verified. Please create your password.";

    }

    catch (error) {

        console.error("Verification error:", error);

        loading.style.display = "none";

        form.style.display = "none";

        message.className = "error";

        message.innerText =
            "Verification failed: " + error.message;

    }

}

// ========================================
// SAVE PASSWORD
// ========================================

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!verified) {

        message.innerText =
            "Your account has not been verified.";

        return;

    }

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    if (password.length < 8) {

        message.innerText =
            "Password must contain at least 8 characters.";

        return;

    }

    if (password !== confirm) {

        message.innerText =
            "Passwords do not match.";

        return;

    }

    saveButton.disabled = true;

    saveButton.innerText = "SAVING...";

    try {

        // VERIFY SESSION AGAIN

        const { data, error: sessionError } =
            await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!data.session) {

            throw new Error(
                "Your session has expired. Please request another link."
            );

        }

        // UPDATE SUPABASE PASSWORD

        const { error } =
            await db.auth.updateUser({

                password: password

            });

        if (error) throw error;

        message.className = "success";

        message.innerText =
            "Password successfully saved! Redirecting to login...";

        form.style.display = "none";

        // SIGN OUT AFTER PASSWORD UPDATE

        await db.auth.signOut();

        setTimeout(function() {

            window.location.href = "login.html";

        }, 2500);

    }

    catch (error) {

        console.error("Password update error:", error);

        message.className = "error";

        message.innerText =
            "Password update failed: " + error.message;

        saveButton.disabled = false;

        saveButton.innerText = "SAVE PASSWORD";

    }

});

// ========================================
// START
// ========================================

verifyInvitation();

</script>

</body>
</html>
