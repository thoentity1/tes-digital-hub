<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>TES Admin Portal | The Entity Solutions</title>

<style>
:root {
    --bg: #07111f;
    --panel: #0d1b2c;
    --panel2: #102338;
    --teal: #19d3d0;
    --teal-dark: #0da6b2;
    --text: #eef7fb;
    --muted: #9bb0c1;
    --gold: #e5bd6b;
    --border: rgba(137,180,202,.18);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 80% 0%, rgba(25,211,208,.09), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* HEADER */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 35px;
    background: rgba(5,13,24,.95);
    border-bottom: 1px solid var(--border);
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand-logo {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 1px solid var(--teal);
    border-radius: 12px;
    color: var(--teal);
    font-weight: 900;
    font-size: 17px;
}

.brand-name {
    font-weight: 800;
    letter-spacing: 1px;
    font-size: 15px;
}

.brand-sub {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 5px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.status {
    color: var(--teal);
    background: rgba(25,211,208,.08);
    border: 1px solid rgba(25,211,208,.25);
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 12px;
}

.btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 15px;
    border-radius: 9px;
    font-size: 12px;
}

.btn:hover {
    border-color: var(--teal);
}

.btn-primary {
    background: var(--teal);
    color: #06202a;
    border-color: var(--teal);
    font-weight: bold;
}

/* LAYOUT */

.layout {
    display: grid;
    grid-template-columns: 245px minmax(0,1fr);
    min-height: calc(100vh - 85px);
}

.sidebar {
    padding: 25px 16px;
    border-right: 1px solid var(--border);
    background: rgba(7,17,31,.65);
}

.nav-heading {
    color: #7191a8;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 0 12px;
    margin: 10px 0 13px;
}

.nav {
    display: grid;
    gap: 6px;
    margin-bottom: 28px;
}

.nav a {
    padding: 13px 12px;
    border-radius: 9px;
    color: #b7c9d5;
    font-size: 13px;
    border: 1px solid transparent;
}

.nav a:hover,
.nav a.active {
    color: var(--teal);
    background: rgba(25,211,208,.08);
    border-color: rgba(25,211,208,.15);
}

.sidebar-info {
    margin: 20px 8px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

/* MAIN */

main {
    padding: 35px;
    min-width: 0;
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
}

.eyebrow {
    color: var(--teal);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.welcome {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 28px;
}

h1 {
    font-size: clamp(28px,4vw,42px);
    margin: 0 0 12px;
    letter-spacing: -1px;
}

h1 span {
    color: var(--teal);
}

.lead {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    max-width: 650px;
    margin: 0;
}

.stage {
    color: var(--gold);
    background: rgba(229,189,107,.06);
    border: 1px solid rgba(229,189,107,.25);
    padding: 10px 13px;
    border-radius: 10px;
    font-size: 11px;
    white-space: nowrap;
}

.notice {
    padding: 14px 16px;
    border: 1px solid rgba(229,189,107,.25);
    background: rgba(229,189,107,.06);
    border-radius: 10px;
    color: #e8d5ad;
    font-size: 12px;
    line-height: 1.7;
    margin-bottom: 25px;
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 15px;
    margin-bottom: 32px;
}

.stat {
    padding: 21px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(145deg,var(--panel2),var(--panel));
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 16px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
}

.stat-foot {
    color: #7f9bad;
    font-size: 11px;
    margin-top: 10px;
}

/* MODULES */

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 30px 0 17px;
}

h2 {
    font-size: 20px;
    margin: 0;
}

.section-caption {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.modules {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 16px;
}

.card {
    background: linear-gradient(145deg,#102338,#0a1929);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 23px;
}

.module {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    min-height: 165px;
    transition: .2s;
}

.module:hover {
    border-color: rgba(25,211,208,.4);
    transform: translateY(-2px);
}

.module-icon {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: rgba(25,211,208,.09);
    border: 1px solid rgba(25,211,208,.2);
    color: var(--teal);
    font-size: 20px;
}

.module h3 {
    margin: 3px 0 10px;
    font-size: 16px;
}

.module p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    margin: 0 0 17px;
}

.module-link {
    color: var(--teal);
    font-size: 12px;
    font-weight: bold;
}

/* LOWER PANELS */

.bottom-grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 16px;
    margin-top: 18px;
}

.list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
}

.list-row:last-child {
    border-bottom: 0;
}

.tag {
    font-size: 10px;
    color: var(--gold);
    border: 1px solid rgba(229,189,107,.25);
    border-radius: 20px;
    padding: 5px 8px;
    white-space: nowrap;
}

.muted {
    color: var(--muted);
}

footer {
    color: #71889a;
    font-size: 11px;
    padding: 30px 0 8px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
}
